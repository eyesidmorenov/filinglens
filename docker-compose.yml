# FilingLens AI · project services
# Always on: Elasticsearch, the API and the UI (Chainlit). On demand: EDA, ETL, index, Yahoo Finance and RAGAS.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: filinglens-es
    environment:
      - discovery.type=single-node       # a single node, no cluster
      - xpack.security.enabled=false     # no user or password, local development only
      - ES_JAVA_OPTS=-Xms1g -Xmx1g       # 1 GB of memory for Elasticsearch
    ports:
      - "127.0.0.1:9200:9200"            # reachable only from your machine
    volumes:
      - es_data:/usr/share/elasticsearch/data   # the data survives a restart
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qv red"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./api                     # uses the Dockerfile in api/
      additional_contexts:               # the Dockerfile also copies these folders
        search: ./search                 # search (José Luis)
        tenk: ./tenk-answer              # answer generation (Juan Carlos)
    container_name: filinglens-api
    environment:
      # Inside the Compose network, Elasticsearch is reached by its service name,
      # not localhost. Haystack reads this variable when it connects.
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - EMBEDDING_MODEL=BAAI/bge-base-en-v1.5
      # The key is read from the .env file at the root (never committed)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Yahoo Finance snapshots (years after the 10-Ks): the API only reads them, it never calls Yahoo
      - YAHOO_DIR=/app/data/yahoo
    volumes:
      - hf_models:/root/.cache/huggingface   # reuses the BGE model already downloaded
      - ./data/yahoo:/app/data/yahoo:ro      # written by: docker compose --profile yahoo run --rm yahoo
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy       # the API starts only when Elasticsearch is ready
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  ui:
    build: ./ui                          # uses the Dockerfile in ui/
    container_name: filinglens-ui
    environment:
      # Chainlit calls the API by its service name, not localhost.
      - API_URL=http://api:8000
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      api:
        condition: service_healthy       # the UI starts only when the API is ready

  eda:
    build: ./eda
    container_name: filinglens-eda
    profiles: ["eda"]                    # on demand only: docker compose --profile eda up eda
    ports:
      - "127.0.0.1:8888:8888"            # Jupyter, reachable only from your machine
    volumes:
      - ./eda:/app/eda                   # the notebook and the .env are read from your folder, and changes are saved there
      - ./data:/app/data                 # the scripts write data/eda and data/raw on your machine

  etl:
    build: ./etl
    container_name: filinglens-etl
    profiles: ["etl"]                    # on demand only: docker compose --profile etl run --rm etl
    environment:
      - TOKENIZER_MODEL=BAAI/bge-base-en-v1.5   # measures chunks in tokens of the same model as the index
    volumes:
      - ./data:/app/data                 # reads data/raw, writes data/clean and data/chunks
      - hf_models:/root/.cache/huggingface   # the tokenizer is downloaded only once

  index:
    build: ./index
    container_name: filinglens-index
    profiles: ["index"]                  # on demand only: docker compose --profile index run --rm index
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - EMBEDDING_MODEL=BAAI/bge-base-en-v1.5
      - EMBEDDING_DIMS=768
    volumes:
      - ./data:/app/data                 # reads data/chunks, caches the embeddings in data/embeddings
      - hf_models:/root/.cache/huggingface   # the BGE model is downloaded only once
    depends_on:
      elasticsearch:
        condition: service_healthy

  yahoo:
    build: ./yahoo-finance
    container_name: filinglens-yahoo
    profiles: ["yahoo"]                  # on demand only: docker compose --profile yahoo run --rm yahoo
    volumes:
      - ./data:/app/data                 # writes data/yahoo/coverage.csv and data/yahoo/snapshots

  # RAGAS evaluation of the answers, in three steps (see answer-eval/README.md)
  # Step 1: answers the questions (labeled or written by RAGAS) with the API's own pipeline (same image as api)
  ragas-answers:
    build:
      context: ./api
      additional_contexts:
        search: ./search
        tenk: ./tenk-answer
    profiles: ["ragas"]                  # on demand only: docker compose --profile ragas run --rm ragas-answers
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - EMBEDDING_MODEL=BAAI/bge-base-en-v1.5
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - YAHOO_DIR=/app/data/yahoo
      - PYTHONPATH=/app:/app/answer-eval
      - DATA_DIR=/app/data
      - QUESTIONS_FILE=/app/search/evaluation/questions.json
    volumes:
      - hf_models:/root/.cache/huggingface
      - ./data/yahoo:/app/data/yahoo:ro
      - ./data/eval:/app/data/eval       # writes data/eval/ragas/<date>/answers.jsonl
      - ./search/evaluation:/app/search/evaluation:ro
      - ./answer-eval:/app/answer-eval:ro
    command: ["python", "-m", "ragas_eval.answers"]
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Steps 0 and 2: RAGAS writes the questions and scores the answers (own image: other Anthropic and LangChain versions)
  ragas:
    build: ./answer-eval
    profiles: ["ragas"]                  # on demand only: docker compose --profile ragas run --rm ragas
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - EMBEDDING_MODEL=BAAI/bge-base-en-v1.5
      - QUESTIONS_FILE=/app/search/evaluation/questions.json   # the 50 companies of the evaluation set
    volumes:
      - hf_models:/root/.cache/huggingface
      - ./data/eval:/app/data/eval       # writes testset.jsonl, scores.csv and summary.json
      - ./data/chunks:/app/data/chunks:ro   # the documents RAGAS writes the questions from (step 0)
      - ./search/evaluation:/app/search/evaluation:ro

volumes:
  es_data:
  hf_models: