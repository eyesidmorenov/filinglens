# FilingLens AI · servicios del proyecto
# Hoy solo Elasticsearch. Cada carril agrega aquí su bloque: api, ui, etl.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: filinglens-es
    environment:
      - discovery.type=single-node        # un solo nodo, sin clúster
      - xpack.security.enabled=false      # sin usuario ni clave, solo para desarrollo local
      - ES_JAVA_OPTS=-Xms1g -Xmx1g        # 1 GB de memoria para Elasticsearch
    ports:
      - "127.0.0.1:9200:9200"             # solo accesible desde tu máquina
    volumes:
      - es_data:/usr/share/elasticsearch/data   # los datos sobreviven si se apaga
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qv red"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  es_data:
