[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "search-index"
version = "0.1.0"
description = "Read-only health, stats and filters for the FilingLens Elasticsearch index"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "elasticsearch>=8,<9",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs Elasticsearch (docker compose up -d elasticsearch)",
]

[tool.coverage.run]
source = ["search_index"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
